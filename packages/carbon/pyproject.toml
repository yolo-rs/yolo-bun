[workspace]
members = [
  "python/carbon_core",
  "python/carbon_cli",
  "python/carbon_web",
  "python/gemma_train",
  "python/carbon_graph",
  "python/carbon_gemini_web",
]

[tool.uv.workspace]
members = [
  "python/carbon_core",
  "python/carbon_cli",
  "python/carbon_web",
  "python/gemma_train",
  "python/carbon_graph",
  "python/carbon_gemini_web",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "RUF"]
ignore = ["E501"]

[dependency-groups]
dev = ["pytest>=9.2.0"]
