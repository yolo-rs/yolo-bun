#
# LiteLLM Unified Gateway Configuration — Google DeepMind Carbon (Paris europe-west9 -> Global)
# Bridges Vertex AI, Gemini Web App (:8789 / StreamGenerate), Local Rust FFI Gemma 4, and OpenRouter
# into a single OpenAI-compatible endpoint for AGY CLI, Open WebUI, and Agent SDKs.

model_list:
  - model_name: gemini-4-argon
    litellm_params:
      model: openai/gemini-4-argon
      api_base: http://127.0.0.1:4040/v1
      api_key: sk-carbon-deepmind-paris
    model_info:
      description: "Google DeepMind Flagship High-Reasoning Model (Paris europe-west9 + Gemini Web Co-Runtime)"
      max_tokens: 65536
      max_input_tokens: 2097152

  - model_name: gemini-4-carbon
    litellm_params:
      model: vertex_ai/gemini-4-carbon
      vertex_project: carbon-intelligence-2026
      vertex_location: europe-west9
    model_info:
      description: "Vertex AI Sub-10ms Sparse MoE Router (Paris europe-west9 / Iowa us-central1)"
      max_tokens: 32768
      max_input_tokens: 2097152

  - model_name: gemini-web-deep-research
    litellm_params:
      model: openai/gemini-web-deep-research
      api_base: http://127.0.0.1:4040/v1
      api_key: sk-carbon-deepmind-paris
    model_info:
      description: "Gemini Web App Autonomous Multi-Step Deep Research Mode"

  - model_name: gemma-4-e2b-it
    litellm_params:
      model: openai/gemma-4-e2b-it
      api_base: http://127.0.0.1:4040/v1
      api_key: sk-carbon-deepmind-paris
    model_info:
      description: "On-Device Bare-Metal Rust 2024 FFI & Dawn WebGPU Gemma 4 E2B"
      max_tokens: 8192
      max_input_tokens: 32768

  - model_name: openrouter-gemini-fallback
    litellm_params:
      model: openrouter/google/gemini-2.5-pro
      api_base: https://openrouter.ai/api/v1
      api_key: os.environ/OPENROUTER_API_KEY

router_settings:
  routing_strategy: latency-based-routing
  num_retries: 2
  timeout: 120

general_settings:
  master_key: sk-carbon-deepmind-paris
  database_connection_pool_limit: 20
