# Unified WireGuard Rack Mesh Topology (10.66.0.0/24)
# Links Local Windows CUDA Host, GCP US-Central1 Free VM, OVH FR VPS, Hostinger Edge & Cloudflare Tunnel

[Interface]
# Node 1: Primary Workstation & Local CUDA 13.4 Host (NVIDIA RTX 4070 12GB)
Address = 10.66.0.1/24
ListenPort = 51820
MTU = 1420

# Node 2: Google Cloud US-Central1 Free Tier e2-micro (US Egress, Chromium Crawler, ADC Bridge)
[Peer]
PublicKey = GCP_US_CENTRAL1_WIREGUARD_PUBLIC_KEY_PLACEHOLDER=
AllowedIPs = 10.66.0.2/32
Endpoint = us-central1-crawler.carbon-intelligence-2026.internal:51820
PersistentKeepalive = 25

# Node 3: OVH Cloud France (Gravelines / Roubaix — High-Bandwidth AVX-512 CPU Inference & Docker)
[Peer]
PublicKey = OVH_FR_GRAVELINES_WIREGUARD_PUBLIC_KEY_PLACEHOLDER=
AllowedIPs = 10.66.0.3/32
Endpoint = gra1.ovh.carbon.mesh.internal:51820
PersistentKeepalive = 25

# Node 4: Hostinger Edge VPS (Europe — Redis PubSub Bus, TURN/STUN WebTransport Live Relay)
[Peer]
PublicKey = HOSTINGER_EU_EDGE_WIREGUARD_PUBLIC_KEY_PLACEHOLDER=
AllowedIPs = 10.66.0.4/32
Endpoint = eu1.hostinger.carbon.mesh.internal:51820
PersistentKeepalive = 25
