# Vertex AI Custom Training Job Specification (aiplatform.googleapis.com/v1)
# Continuous QLoRA & Tunix SFT of Gemma 4 E2B on Upstream Bun Source Code (134 Crates)

displayName: "gdm-carbon-gemma4-e2b-bun-upstream-sft"
jobSpec:
  workerPoolSpecs:
    - machineSpec:
        machineType: "ct6e-standard-4t"
        acceleratorType: "TPU_V6E"
        acceleratorCount: 4
      replicaCount: 1
      diskSpec:
        bootDiskType: "pd-ssd"
        bootDiskSizeGb: 200
      containerSpec:
        imageUri: "europe-west4-docker.pkg.dev/carbon-intelligence-2026/deepmind-carbon-registry/gemma4-tunix-trainer:latest"
        command:
          [
            "uv",
            "run",
            "--package",
            "gemma-train",
            "gemma-train-py",
            "--execute",
          ]
        env:
          - name: BASE_MODEL_ID
            value: "google/gemma-4-e2b-it"
          - name: DATASET_CORPUS
            value: "gs://deepmind-carbon-ew9-datasets/oven-bun-v1.4.4-ast-sft.jsonl"
          - name: VERTEX_CONTEXT_CACHE_TTL
            value: "86400s"
          - name: GCP_REGION
            value: "europe-west4"
  scheduling:
    timeout: "28800s"
    restartJobOnWorkerRestart: true
