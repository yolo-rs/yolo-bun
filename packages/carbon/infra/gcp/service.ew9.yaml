# Knative / Google Cloud Run v2 Declarative Service Specification
# Region: europe-west9 (Paris, France — Google DeepMind Hub)

apiVersion: serving.knative.dev/v1
kind: Service
metadata:
  name: deepmind-carbon-control-plane
  namespace: carbon-intelligence-2026
  labels:
    cloud.googleapis.com/location: europe-west9
    app.kubernetes.io/part-of: google-deepmind-carbon
    app.kubernetes.io/managed-by: gcloud-run
  annotations:
    run.googleapis.com/ingress: all
    run.googleapis.com/launch-stage: BETA
    run.googleapis.com/description: "Google DeepMind Carbon Intelligence, MCP Server & Gemma 4 WebGPU Hub (Paris Beta)"
spec:
  template:
    metadata:
      annotations:
        run.googleapis.com/execution-environment: gen2
        run.googleapis.com/cpu-throttling: "false"
        run.googleapis.com/startup-cpu-boost: "true"
        autoscaling.knative.dev/minScale: "1"
        autoscaling.knative.dev/maxScale: "100"
    spec:
      containerConcurrency: 250
      timeoutSeconds: 300
      serviceAccountName: carbon-runtime-sa@carbon-intelligence-2026.iam.gserviceaccount.com
      containers:
        - name: carbon-aot-runtime
          image: europe-west9-docker.pkg.dev/carbon-intelligence-2026/deepmind-carbon-registry/deepmind-carbon-control-plane:latest
          ports:
            - name: http1
              containerPort: 4040
          env:
            - name: PORT
              value: "4040"
            - name: GCP_PROJECT
              value: "carbon-intelligence-2026"
            - name: GCP_PRIMARY_REGION
              value: "europe-west9"
            - name: GEMINI_MODEL
              value: "gemini-4-argon"
          resources:
            limits:
              cpu: "4000m"
              memory: "8Gi"
