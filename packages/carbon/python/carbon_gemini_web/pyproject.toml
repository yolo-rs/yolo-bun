[project]
name = "carbon-gemini-web"
version = "4.0.0"
description = "Python Gemini Web App Client (StreamGenerate RPC, Cookie Rotation, SNlM0e & OpenAI Gateway Bridge)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["carbon-core"]

[project.scripts]
carbon-gemini-web-py = "carbon_gemini_web:print_gemini_web_summary"

[tool.uv.sources]
carbon-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
